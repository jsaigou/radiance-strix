# The fleet tp2.yaml serves, for two cards: the server's configuration (docs/MULTIMODEL.md, 4).
# An entry's name is the model id a request gives; its model is a file or a checkpoint
# directory under /models, where the compose file mounts RADIANCE_MODELS.
#
#   RADIANCE_API_KEY=x radiance --config tp2.radiance.yaml --check
#
# parses and validates it and serves nothing (the key's variable has to be set).
#
# The containers are the README's (its Models table); delete the entries of those you do not
# have.
#
# The models have one priority, so the one used least recently gives way to the one a request
# asks for. The large models run on both cards (tp: 2) and the small ones on one, which the
# fleet picks. A model that left its cards comes back from host memory or from its container.
#
# MiniMax-H3 needs 29.2 GiB of each 32 GB card and holds 1.4 GiB more while it is on them,
# so every other model unloads for it and comes back from its container afterwards. A 5 s
# clip takes about a minute, 13 to 15 s of it the load.
#
# With 61 GB of host memory Flash-Next is unloaded, not parked, when the other models need the
# host memory it pins, and answers its next request after 14 to 17 s. Measured on two Radeon
# AI PRO R9700 (32 GB each): two rounds of one request to each model, MiniMax-H3 after all
# the others in the first, all answered.
server:
  host: "::"
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 160
scheduler:
  load-timeout: 600s
models:
  # Qwen3.8-Flash-Next (IQR-V4 experts, int8 trunk, draft head, vision) on both cards. The
  # experts that do not fit the cards sit in a pinned host pool of 16 GiB in all, 8 GiB a rank.
  flashnext:
    model: /models/qwen3.8-next-flash-iqr-v4.rad
    tp: 2
    tp-wire: wht6
    max-num-seqs: 8
    max-model-len: 200000
    placement: expert_tiered
    host-pool-mib: 16384
    kv-cache-dtype: i8
    prefix-cache-mib: 4096
    num-speculative-tokens: 3
    max-num-batched-tokens: 2048
  # Qwen3.8-27B IQ8R (rotated int8), DFlash2 drafter, vision, on both cards.
  qwen3.8-27b:
    model: /models/qwen3.8-27b-iq8r-dflash.rad
    tp: 2
    max-num-seqs: 32
    max-model-len: 200000
    kv-cache-dtype: i8
  # MiniCPM5-2B IQ8R with its DSpark drafter.
  minicpm5-2b:
    model: /models/minicpm5-2b-iq8r.rad
    tp: 1
    max-num-seqs: 16
    max-model-len: 131072
    kv-cache-dtype: i8
    max-num-batched-tokens: 512
  # EmbeddingGemma 2 bf16: text, image, video and audio embeddings.
  embeddinggemma2:
    model: /models/embeddinggemma2-bf16.rad
    tp: 1
    max-num-seqs: 64
    max-num-batched-tokens: 8192
  # Nemotron 3.5 Rerank 8B BF16, the checkpoint directory as NVIDIA ships it: /rerank, /v1/rerank.
  nemotron-rerank:
    model: /models/Nemotron-3.5-Rerank-8B-BF16
    tp: 1
    max-model-len: 32768
    max-num-batched-tokens: 32768
  # Qwen3-ASR 1.7B bf16, the checkpoint directory as Qwen ships it: /v1/audio/transcriptions and
  # live over /v1/realtime.
  qwen3-asr:
    model: /models/Qwen3-ASR-1.7B-hf
    tp: 1
    max-num-seqs: 16
  # Breeze-TTS-2 bf16: /v1/audio/speech, whole, streamed or live.
  breeze-tts2:
    model: /models/breeze-tts2-bf16.rad
    tp: 1
  # Qwen-Image 2.1 IQ8R on both cards: /v1/images/generations and /v1/images/edits. A request
  # holds two sequences of max-model-len tokens in the cache, which at the model's own 33600 is
  # more than the cards: 20480 tokens cover its default 2048x2048 picture (16384 tokens).
  qwen-image:
    model: /models/qwen-image-2.1-iq8r.rad
    tp: 2
    tp-wire: wht6
    max-model-len: 20480
  # MiniMax-H3, int8 DiT, on both cards: video with its soundtrack, /v1/videos.
  minimax-h3:
    model: /models/minimax-h3-i8.rad
    tp: 2
    vision-tower-placement: ram
  # MiniMax-Music3 bf16 on both cards: songs from lyrics and a description, /v1/audio/speech.
  minimax-music3:
    model: /models/minimax-music3-bf16.rad
    tp: 2
  # Hunyuan3D-2's shape model, bf16: a 3-D mesh from one picture, /generate.
  hunyuan3d-2:
    model: /models/hunyuan3d-2-bf16.rad
    tp: 1
